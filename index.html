<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Catch the Snowflake!</title>
  <link rel="stylesheet" type="text/css" href="Resources/css/index.css">
</head>
<body>
  
  <div id="startScreen">
    <h1><b>Catch the Snowflake!</b></h1>
    <p>Instructions:</p>
    <p>Using the arrow keys on your keyboard, move your bucket right or left to catch the snowflakes falling from the top of your screen.</p>
    <button id="startButton">Start Game</button>
  </div>

  <div id="gameContainer" style="display: none;">
    <h1><b>Catch the Snowflake!</b></h1>
    <div id="gameArea">
        <div id="player"></div>
    </div>
    <div id="score"></div>
  </div>

  <script src="Resources/js/script.js"></script>

</body>
</html>
